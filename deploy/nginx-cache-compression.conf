# Configuracao recomendada para Nginx (site estatico Astro em /dist)
# Inclua dentro do bloco `server { ... }` do site www.bizsys.com.br
# (Verifique se /etc/nginx/mime.types possui image/avif, image/webp e font/otf)

# 1. Compressao Gzip para ativos baseados em texto (CSS, JS, JSON, SVG, XML, fontes)
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/otf
    font/ttf;

# 2. Cache imutavel de 1 ano para bundles com hash gerados pelo Astro (/_astro/*)
location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# 3. Cache longo (30 dias) para imagens, fontes e videos estaticos
location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?|otf|ttf|webm|mp4)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# 4. Revalidacao para HTML, sitemap e robots para refletir novos deploys imediatamente
location ~* \.(?:html|xml|txt)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}
