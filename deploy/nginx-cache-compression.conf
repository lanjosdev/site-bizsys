# Configuracao recomendada para Nginx (site estatico Astro em /dist)
# Inclua dentro do bloco `server { ... }` do site www.bizsys.com.br
#
# Observacao importante de MIME types:
# Certifique-se de que /etc/nginx/mime.types registre `font/otf otf;` para que
# a fonte GoodSans-Light.otf seja servida com o tipo correto e comprimida via Gzip:
# sudo sed -i '/image\/avif/a \    font/otf                                         otf;' /etc/nginx/mime.types

# 1. Compressao Gzip para ativos baseados em texto, JSON, SVG e fontes
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/otf
    font/ttf;

# 2. Cache imutavel de 1 ano para bundles gerados pelo Astro com hash (/_astro/*)
location ^~ /_astro/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# 3. Cache longo (30 dias) para imagens, fontes e videos estaticos
location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?|otf|ttf|webm|mp4)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# 4. Navegacao e paginas HTML (revalidacao imediata para novos deploys)
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
